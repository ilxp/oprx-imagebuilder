# ==============================================================================
# 全局配置 —— 唯一事实源
# 修改此文件 → push → CI 自动重建
#
# 分区：
#   1. 版本            VERSION / DEFAULT_TARGET
#   2. 系统身份        BRAND / HOSTNAME / TIMEZONE / ...
#   3. 产物开关        GENERATE_* / RELEASE_VARIANT
#   4. 网络            LAN_IP / IS_BYPASS_ROUTER / ...
#   5. 凭据            ROOT_PASSWORD_HASH / SSH_PORT
#   6. 功能开关        ENABLE_ARGON / ENABLE_DOCKER
#   7. 系统调优        NF_CONNTRACK_MAX / ENABLE_BBR / zram
#   8. 仓库            REPOS
#   9. 自建包          CUSTOM_ASSETS_FILE
#   10. onup           ONUP_REPO / ONUP_JSON_TAG
#   11. 发布           KEEP_RELEASES
# ==============================================================================

# ========== 1. ImageBuilder 下载源（唯一事实源）==========
#
# __DISTRO__        由 IB_DISTRO 展开（openwrt / immortalwrt）
# __RELEASE_PATH__  由 IB_CHANNEL + VERSION 决定：
#
#
# 换家 / 换渠道 / 换版本：
#   - 本地：改 IB_DISTRO / IB_CHANNEL / VERSION
#   - CI：version input 填 <distro>/<version> 或 <distro>/<channel>/<version>
#         openwrt/25.12.6
#         immortalwrt/25.12-SNAPSHOT
#         openwrt/snapshot            （VERSION 自动用当天短日期）
#         openwrt/snapshot/26.11.6    （显式日期）

# ---- 源代码 ----
IB_DISTRO="openwrt"          # openwrt | immortalwrt

# ---- 渠道 ----
# 三个合法值，默认推荐 ""：
#   ""          自动：由 VERSION 推导（日常用这个，90% 场景）
#   "snapshots" 显式开发快照：VERSION 是短日期（如 26.11.6）时必须用
#   "releases"  显式稳定版：极少用（"" + VERSION="25.12.6" 已自动正确）
#
# IB_CHANNEL="" 时，ib_release_path() 的返回值（__RELEASE_PATH__）：
#   VERSION="25.12.6"              → releases/25.12.6              ✅
#   VERSION="SNAPSHOT" / ""        → snapshots                    ✅
#   VERSION="25.12-SNAPSHOT"       → releases/25.12-SNAPSHOT（仅 immortalwrt有）✅
#   VERSION="26.11.6"（短日期）     → releases/26.11.6             ❌ 404，必须显式
#
# 唯一必须显式的场景（snapshots + 短日期）：
#   IB_CHANNEL="snapshots"
#   VERSION="26.11.6"              → snapshots（VERSION 只用于命名）
#
# 从github的ci传 version input 即可（load_config 会自动设 IB_CHANNEL）：
#   openwrt/25.12.6                稳定版
#   immortalwrt/25.12.6            稳定版
#   immortalwrt/25.12-SNAPSHOT     稳定分支快照
#   openwrt/snapshot               开发快照（VERSION 自动用当天短日期）
#   openwrt/snapshot/26.11.6       开发快照（显式日期）（这个用得少，一般自动计算短日期）
IB_CHANNEL=""

# ---- Base URL ----
IMAGEBUILDER_BASE_URL="https://downloads.__DISTRO__.org/__RELEASE_PATH__/targets"

# 镜像站示例（保留 __DISTRO__ 占位符）：
# IMAGEBUILDER_BASE_URL="https://mirror.nju.edu.cn/__DISTRO__/__RELEASE_PATH__/targets"

# ---- 产品名（一般留空）----
# 留空 = 从 IMAGEBUILDER_BASE_URL 自动推断（含 immortalwrt → immortalwrt，含 openwrt → openwrt）
# 仅当镜像站 URL 不含 openwrt/immortalwrt 时才需要显式指定，如：
#   IMAGEBUILDER_BASE_URL="https://cdn.example.com/fw/__RELEASE_PATH__/targets"
#   IB_PRODUCT="openwrt"
IB_PRODUCT=""

# ---- 版本与标签+平台 ----
# VERSION 用法：
#   稳定版         "25.12.6"
#   稳定分支快照   "25.12-SNAPSHOT"
#   开发快照       "" 或 "SNAPSHOT"    → 自动替换为当天短日期（如 26.11.6）
#   开发快照锁日期  "26.11.6" + IB_CHANNEL="snapshots"
VERSION="25.12.6"
FW_TAG="oR"                  # 版本标签前缀：产物名、DISTRIB_DESCRIPTION、Release 标题
DEFAULT_VERSION="25.12.6"
DEFAULT_TARGET="x86_64"

# ---- 自建源完整 URL（escape hatch）----
# 填了就忽略 IMAGEBUILDER_BASE_URL / IB_DISTRO / IB_CHANNEL / IB_PRODUCT
# 占位符：__VERSION__ __TARGET__ __SUBTARGET__ __IB_ARCH_TAG__ __IB_HOST_TAG__
# ⚠️ 必须用单引号，防止 ${...} 被提前展开
IB_URL_OVERRIDE=""
# IB_URL_OVERRIDE='https://github.com/ilxp/oprx-imagebuilder/releases/download/ib-v__VERSION__/immortalwrt-imagebuilder-__VERSION__-__IB_ARCH_TAG__.__IB_HOST_TAG__.tar.zst'

# ========== 2. 系统身份 ==========
BRAND="OprX"                                # 固件名前缀 + 系统品牌
HOSTNAME="OprX"                             # 设备主机名
TIMEZONE="CST-8"                            # uci system.@system[0].timezone
ZONENAME="Asia/Shanghai"                    # 时区文件路径 /usr/share/zoneinfo/<ZONENAME>
LUCI_LANG="zh_cn"                           # LuCI 默认语言
NTP_SERVERS="ntp.aliyun.com ntp.tencent.com cn.ntp.org.cn"
AUTHOR="ilxp"                               # 版本描述里的作者（用于 DISTRIB_DESCRIPTION）

# ========== 3. 产物开关 ==========
#
# 每个开关 true/false，可自由组合。
# 最终产物 = 文件系统 × 打包方式，叉乘出来的每个组合各出一个文件。
# 至少一个组合有效，否则回退到 RELEASE_VARIANT 兜底。

# ---- 3.1 文件系统（可同时选）----
GENERATE_EXT4="false"                       # ext4：可写，升级可增量
GENERATE_SQUASHFS="true"                    # squashfs：只读，可恢复出厂

# ---- 3.2 打包 / 引导方式（可同时选）----
# x86 目标：combined-efi（EFI 引导）/ combined（Legacy BIOS）
# ARM 目标：sysupgrade（u-boot 引导整盘）
GENERATE_COMBINED_EFI="true"
GENERATE_COMBINED="false"
GENERATE_SYSUPGRADE="true"

# ---- 3.3 虚拟化 ----
GENERATE_VMDK="false"                       # 仅 x86 生效

# ---- 3.4 兜底（上面 3.1×3.2 全空时用这个）----
RELEASE_VARIANT="squashfs-combined-efi"

# ========== 4. 网络 ==========
#
# 主路由（默认）：只设 LAN_IP，GATEWAY_IP / DNS_SERVERS 留空
# 旁路由：IS_BYPASS_ROUTER="true"，GATEWAY_IP=主路由 IP，DNS_SERVERS=主路由 DNS + 公网
LAN_IP="192.168.8.1"
LAN_NETMASK="255.255.255.0"
IS_BYPASS_ROUTER="false"
GATEWAY_IP=""                               # 主路由模式不生效
DNS_SERVERS=""                              # 主路由模式不生效

# 旁路由示例（取消注释并把 IS_BYPASS_ROUTER 改 true）：
# IS_BYPASS_ROUTER="true"
# GATEWAY_IP="192.168.8.2"
# DNS_SERVERS="192.168.8.2 8.8.8.8"

# ========== 5. 凭据 ==========
#
# 三选一，优先级 HASH > PLAIN > 空（无密码）：
#   生产：GitHub Secret 传 ROOT_PASSWORD_HASH（$6$ 开头）
#   本地：填 ROOT_PASSWORD_PLAIN，构建时自动转 hash（明文不进镜像）
#   不填：无密码（首次调试用，生产禁用）
# SHA-512 hash（明文 password）
ROOT_PASSWORD_HASH='$6$XzQm36OLij1.lc8g$BU2GvsleiqI0R3RaCzj4IVWZC2essUVRS2ad1j7DZU./g1rdw5qslYu2DCw66IG9AQaJRnzuZAkwpWXm88Dma1'

ROOT_PASSWORD_PLAIN=""
SSH_PORT="22"

# ========== 6. 功能开关 ==========
#ENABLE_ARGON="false"                        # ⚠️ ImageBuilder 官方源无 argon apk，开了会被剔除
ENABLE_DOCKER="false"                       # 启用后追加 docker/dockerd/docker-compose/luci-app-dockerman
ENABLE_BYPASS_ROUTER="false"                # 与 IS_BYPASS_ROUTER 二选一，这个用于启动脚本里的判断

# ========== 7. 系统调优 ==========
NF_CONNTRACK_MAX="65535"                    # 官方默认 16384
ENABLE_BBR="true"                           # 需 kmod-tcp-bbr
ENABLE_ZRAM="true"                          # 需 zram-swap
ZRAM_PERCENT="25"                           # zram 大小 = 物理内存的 25%
ZRAM_ALGO="lz4"                             # lz4 | zstd

# ========== 8. 仓库（预装 + 刷机后保留）==========
#
# 格式: name|url|key_url|enabled
#   占位符: __VERSION__ __ARCH__ __TARGET__ __SUBTARGET__ __SERIES__
#   key_url="(内置)" 表示不需要签名
#   enabled=true 才生效
#
# 说明：
#   - 官方源（downloads.openwrt.org）由 ImageBuilder 自带，这里再写一遍是
#     为了让「刷机后」的 files/etc/apk/repositories.d/ 也有官方源（可装包）
#   - 第三方源启用了会自动写密钥到两处（构建时 + 刷机后）
REPOS="
# ---- 官方源 (apk v3 格式，必须精确到 packages.adb) ----
# __RELEASE_PATH__ 由 ib_release_path() 展开：
#   releases 渠道 → releases/25.12.6
#   snapshots 渠道 → snapshots（不是 releases/26.11.7！）
official-base|https://downloads.__DISTRO__.org/__RELEASE_PATH__/packages/__ARCH__/base/packages.adb|(内置)|true
official-luci|https://downloads.__DISTRO__.org/__RELEASE_PATH__/packages/__ARCH__/luci/packages.adb|(内置)|true
official-packages|https://downloads.__DISTRO__.org/__RELEASE_PATH__/packages/__ARCH__/packages/packages.adb|(内置)|true
official-routing|https://downloads.__DISTRO__.org/__RELEASE_PATH__/packages/__ARCH__/routing/packages.adb|(内置)|true
official-telephony|https://downloads.__DISTRO__.org/__RELEASE_PATH__/packages/__ARCH__/telephony/packages.adb|(内置)|true
official-video|https://downloads.__DISTRO__.org/__RELEASE_PATH__/packages/__ARCH__/video/packages.adb|(内置)|true
official-target|https://downloads.__DISTRO__.org/__RELEASE_PATH__/targets/__TARGET__/__SUBTARGET__/packages/packages.adb|(内置)|true

# ---- 第三方源 ----
qiusimons|https://qiusimons.github.io/OpenWrt-Add/__ARCH__/packages.adb|https://qiusimons.github.io/OpenWrt-Add/keys/custom-feed.rsa.pub|true
cooluc|https://opkg.cooluc.com/openwrt-__SERIES__/__ARCH__/packages.adb|https://opkg.cooluc.com/key-build.pem|true
# nju 如果不开就直接注释掉或写 false
nju|https://mirror.nju.edu.cn/openwrt/releases/__VERSION__/packages/__ARCH__/packages/packages.adb|(内置)|false

# ---- dllkids 聚合源 ----
dllkids|https://down.dllkids.xyz/openwrt-feed/__SERIES__/__ARCH__/packages.adb|https://down.dllkids.xyz/openwrt-feed/keys/dllkids-feed.pub.pem|true
# dllkids 子源（比如honk clashoo、daed）：
#dllkids-honk|https://down.dllkids.xyz/openwrt-feed/honk/__SERIES__/__ARCH__|https://down.dllkids.xyz/openwrt-feed/keys/dllkids-feed.pub.pem|true
#dllkids-clashoo|https://down.dllkids.xyz/openwrt-feed/clashoo/__SERIES__/__ARCH__|https://down.dllkids.xyz/openwrt-feed/keys/dllkids-feed.pub.pem|true
#dllkids-mosdns|https://down.dllkids.xyz/openwrt-feed/daed/__SERIES__/__ARCH__|https://down.dllkids.xyz/openwrt-feed/keys/dllkids-feed.pub.pem|true
"

# ========== 9. 自建包（从 GitHub Release 抓）==========
#
# 清单放独立文件 config/custom-assets.txt，每行：
#   owner/repo|资产名glob[|!排除glob]
#
# ${VAR} 由 build.sh 在运行时展开（ARCH_PACKAGES / VERSION / ...）
CUSTOM_ASSETS_FILE="config/custom-assets.txt"

# ========== 10. 生成 ONUP 在线升级 FW_TAG.json需要的内容：存放固件的仓库名和发布的tag ==========
ONUP_JSON_TAG="firmware"                    # oR.json 上传到的固定 Release tag
ONUP_REPO="ilxp/oprx-release"         		# onup 检测升级用的仓库（owner/repo）

# ========== 11. 发布 ==========
KEEP_RELEASES="2"                           # 每个 target 保留最近 N 条归档 Release