# ==============================================================================
# 友善 NanoPi R2S
# ==============================================================================
CONF_TARGET="r2s"

TARGET="rockchip"
SUBTARGET="armv8"
ARCH_PACKAGES="aarch64_generic"

IB_ARCH_TAG="rockchip-armv8"
IB_HOST_TAG="Linux-x86_64"

PROFILE="friendlyarm_nanopi-r2s"

ROOTFS_FS="ext4"
ROOTFS_SIZE_MB="1024"
EXTRA_IMAGE_NAME="1g"

RELEASE_VARIANT="ext4-sysupgrade"
VARIANT_DESC="ext4 整盘 sysupgrade 镜像（含 u-boot）"

ENABLE_INTEL_PSTATE="false"
ZRAM_PERCENT="25"

PACKAGES_ARCH_EXTRA="
kmod-usb-net-rtl8152
uboot-envtools
kmod-gpio-button-hotplug
"