# ==============================================================================
# x86_64 目标 —— 标准软路由 / 工控机 / 虚拟机
# 由 build.sh 以 `. config/targets/x86_64.conf` 加载
# 覆盖优先级：本文件 > config/build.conf（同名变量会被覆盖）
#
# ⚠️ PACKAGES_ARCH_EXTRA 里**只能放包名**，不能有中文 / `#` 注释 / 空行之外的
#    任何非包名字符 —— 会被 shell 词分割后当成"包名"传给 make image，
#    导致 `no such package` 剔除。
#
# ⚠️ snapshot 兼容：以下标记的包在 OpenWrt/ImmortalWrt snapshots 源里
#    **可能不存在**，会被自愈逻辑自动跳过（进 skipped-packages.txt），
#    不影响构建，但对应硬件可能工作不正常。稳定版源里都存在。
#      [~] kmod-r8126 / kmod-r8127        —— 新 Realtek 2.5G/5G，25.12 才加
#      [~] kmod-txgbe / kmod-ngbe         —— 新万兆网卡，snapshot 视情况
#      [~] kmod-mt7925-firmware / kmod-mt7927-firmware —— Wi-Fi 7 固件，25.12 才加
#    releases 稳定版里都有，snapshots 里如缺失是上游还没同步，等一两天即可。
# ==============================================================================

# ---- 自声明（防止复制错文件） ----
CONF_TARGET="x86_64"

# ---- OpenWrt target 三元组 ----
TARGET="x86"
SUBTARGET="64"
ARCH_PACKAGES="x86_64"

# ---- ImageBuilder 归档名 ----
# 完整名：<distro>-imagebuilder-<ver>-<IB_ARCH_TAG>.<IB_HOST_TAG>.tar.zst
IB_ARCH_TAG="x86-64"
IB_HOST_TAG="Linux-x86_64"

# ---- Profile ----
PROFILE="generic"

# ---- 镜像规格 ----
# ROOTFS_SIZE_MB 是根分区大小（MiB）；EXTRA_IMAGE_NAME 只影响文件名后缀
# 为了文件名和实际大小一致，900 MiB 用 "900m"（不是 "1g"）
ROOTFS_SIZE_MB="900"                        # 900 MiB
EXTRA_IMAGE_NAME="900m"                     # 只影响文件名

# ---- 发布变体（会被 build.conf 的 GENERATE_* 覆盖，仅作兜底）----
RELEASE_VARIANT="squashfs-combined-efi"
VARIANT_DESC="squashfs + EFI 引导整盘镜像"

# ---- 架构专属开关 ----
ENABLE_INTEL_PSTATE="true"
CPU_GOVERNOR="powersave"

# ---- 架构专属预装包 ----
# 分类参考（仅作说明，不写进变量）：
#   存储：nvme / block-mount
#   网卡：e1000 / e1000e / igb / igc / i40e / ixgbe / r8168 / r8125 / tg3 / bnx2 / mlx4 / mlx5 / ...
#   显卡：drm / drm-i915 / drm-amdgpu / drm-radeon / i915-firmware-* / backlight
#   声卡：sound-hda-intel / sound-hda-codec-realtek
#   摄像：video-uvc / video-pwc / video-videobuf2
#   WiFi：mt76x2 / mt7921e / mt7921u / mt7922-firmware / mt7925-firmware / mt7927-firmware
#   USB 串口：usb-serial-cp210x / ch341 / ftdi
#   其他：button-hotplug / grub2-bios-setup
# ==============================================================================
# x86_64 目标 —— 标准软路由 / 工控机 / 虚拟机
# 由 build.sh 以 `. config/targets/x86_64.conf` 加载
# 覆盖优先级：本文件 > config/build.conf（同名变量会被覆盖）
#
# ⚠️ PACKAGES_ARCH_EXTRA 是双引号字符串，里面**不能有任何 # 注释**
#    （shell 不识别字符串里的 #，注释内容会被当成包名）。
#    所有说明写在变量外面，变量里只放包名。
#
# ⚠️ 标注 [~] 的包在 snapshots 源里可能不存在，会被自愈剔除
#    （进 skipped-packages.txt），不影响构建。
# ==============================================================================

CONF_TARGET="x86_64"

TARGET="x86"
SUBTARGET="64"
ARCH_PACKAGES="x86_64"

IB_ARCH_TAG="x86-64"
IB_HOST_TAG="Linux-x86_64"

PROFILE="generic"

ROOTFS_SIZE_MB="900"
EXTRA_IMAGE_NAME="900m"

RELEASE_VARIANT="squashfs-combined-efi"
VARIANT_DESC="squashfs + EFI 引导整盘镜像"

ENABLE_INTEL_PSTATE="true"
CPU_GOVERNOR="powersave"

# ---- 架构专属预装包 ----
# 分类参考：
#   存储：nvme / block-mount
#   网卡：e1000 / e1000e / igb / igc / i40e / ixgbe / r8168 / r8125 / tg3 / bnx2 / mlx4 / mlx5 / ...
#   显卡：drm / drm-i915 / drm-amdgpu / drm-radeon / i915-firmware-* / backlight
#   声卡：sound-hda-intel / sound-hda-codec-realtek
#   摄像：video-uvc / video-pwc / video-videobuf2
#   WiFi：mt76x2 / mt7921e / mt7921u / mt7922-firmware / mt7925-firmware / mt7927-firmware
#   USB 串口：usb-serial-cp210x / ch341 / ftdi
#   其他：button-hotplug / grub2-bios-setup
#
# ⚠️ 变量内不能有 # 注释！下面是纯包名，一行一个。
PACKAGES_ARCH_EXTRA="
# ---- 1. 存储（NVMe 现在是软路由刚需，必加） ----
kmod-nvme
block-mount

# ---- 2. 主流千兆/万兆网卡（保留官方稳定的） ----
kmod-e1000
kmod-e1000e
kmod-igb
kmod-igbvf
kmod-igc
kmod-i40e
kmod-iavf
kmod-ixgbe
kmod-ixgbevf
# kmod-r8169  (官方默认自带 r8169，如果要 r8168 独占，需排除 r8169，这里保留 r8168)
kmod-r8168
# kmod-r8125  (⚠️ 警告：在部分版本会和内核冲突。如果你没有 2.5G 网卡，千万别加！)
# kmod-r8126
# kmod-r8127
kmod-tg3
kmod-bnx2
kmod-bnx2x
kmod-atlantic
kmod-mlxfw
# kmod-mlx4-core (⚠️ 25.12.6 官方源缺失，如需使用请自己传包)
# kmod-mlx5-core
kmod-amazon-ena
kmod-amd-xgbe
kmod-dwmac-intel
kmod-forcedeth

# ---- 3. 显卡、声卡、摄像 ----
kmod-drm
kmod-drm-ttm
kmod-drm-kms-helper
kmod-drm-i915
kmod-drm-amdgpu
kmod-drm-radeon
kmod-backlight
# i915-firmware-dmc (⚠️ 非核心，且部分源不稳定，可不加)
kmod-sound-hda-intel
kmod-sound-hda-codec-realtek
kmod-video-uvc
kmod-video-pwc
kmod-video-videobuf2

# ---- 4. WiFi（如果你没插无线网卡，全部注释掉） ----
# kmod-mt76x2
# kmod-mt7921e
# kmod-mt7921u
# kmod-mt7922-firmware
# kmod-mt7925-firmware (⚠️ 官方源没有，直接砍掉)

# ---- 5. USB 网络共享（如果你要用手机共享网络给路由，保留） ----
kmod-usb-net
kmod-usb-net-asix
kmod-usb-net-asix-ax88179
kmod-usb-net-rtl8150
kmod-usb-net-rtl8152
kmod-usb-net-rndis
kmod-usb-net-ipheth
kmod-usb-net-cdc-ether

# ---- 6. USB 串口 Console（工控机调试线） ----
kmod-usb-serial-cp210x
kmod-usb-serial-ch341
kmod-usb-serial-ftdi

# ---- 7. 基础系统 ----
kmod-button-hotplug
grub2-bios-setup
"